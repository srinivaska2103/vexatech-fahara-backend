version: '3.8'

networks:
  backend_net:
    driver: bridge
    name: fahara_backend_network

volumes:
  postgres_data:
    name: fahara_backend_postgres_data

services:
  postgres:
    image: postgres:17-alpine
    container_name: fahara_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: faharadb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faharadb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fahara_backend_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/faharadb?schema=public
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
