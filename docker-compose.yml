version: '3.8'

networks:
  backend_net:
    driver: bridge
    name: fahara_backend_network

volumes:
  postgres_data:
    name: fahara_backend_postgres_data

services:
  postgres:
    image: postgres:17-alpine
    container_name: fahara_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: FaharaUser
      POSTGRES_PASSWORD: FaharaSecurePassword
      POSTGRES_DB: fahara
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U FaharaUser -d fahara"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fahara_backend_api
    restart: always
    ports:
      - "5433:5433"
    environment:
      NODE_ENV: production
      PORT: 5433
      DATABASE_URL: postgresql://FaharaUser:FaharaSecurePassword@postgres:5432/fahara?schema=public
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
